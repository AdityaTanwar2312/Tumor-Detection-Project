stages:
  data_ingestion:
    cmd: python src/cnnClassifier/pipeline/data_ingestion_pipeline.py
    deps:
      - src/cnnClassifier/pipeline/data_ingestion_pipeline.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/kidney-ct-scan-image

  prepare_base_model:
    cmd: python src/cnnClassifier/pipeline/prepare_base_model_pipeline.py
    deps:
      - src/cnnClassifier/pipeline/prepare_base_model_pipeline.py
      - config/config.yaml
    params:
      - IMAGE_SIZE
      - INCLUDE_TOP
      - WEIGHTS
      - CLASSES
      - LEARNING_RATE
    outs:
      - artifacts/prepare_base_model
  
  train_base_model:
    cmd: python src/cnnClassifier/pipeline/train_base_model_pipeline.py
    deps:
      - src/cnnClassifier/pipeline/train_base_model_pipeline.py
      - config/config.yaml
      - artifacts/prepare_base_model
      - artifacts/data_ingestion/kidney-ct-scan-image
    params:
      - BATCH_SIZE
      - EPOCHS
      - AUGMENTATION
      - IMAGE_SIZE
    outs:
      - artifacts/train_base_model